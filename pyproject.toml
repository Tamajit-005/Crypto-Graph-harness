[project]
name = "cryptoh"
version = "0.1.0"
description = "Spectral graph anomaly detection harness with Gemma 4 multimodal diagnostics"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "pyfiglet>=1.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "google-genai>=1.0",
  "jinja2>=3.1",
  "jsonschema>=4.20",
  "httpx>=0.25",
  "fastapi>=0.109",
  "uvicorn>=0.25",
]

[project.scripts]
cryptoh = "cryptoh.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.2"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryptoh"]
